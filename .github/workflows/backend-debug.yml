name: Backend Debug validation

on:
  push:
    branches: [main, feature/tb1-backend]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
        ports:
          - 33308:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      TB1_TEST_MYSQL: server=127.0.0.1;port=33308;user=root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Set runtime for command integration tests
        run: echo "DOTNET_ROOT=$(dirname "$(readlink -f "$(command -v dotnet)")")" >> "$GITHUB_ENV"
      - name: Debug integration tests and coverage
        run: >-
          dotnet test TerraTech.IntegrationTests -c Debug
          --collect:'XPlat Code Coverage'
          --settings TerraTech.IntegrationTests/coverage.runsettings
          --results-directory TestResults
          --logger 'trx;LogFileName=backend.trx'
      - name: Build Cloud Run image in Debug
        run: docker build --platform=linux/amd64 -t terratech-ci:debug .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-debug-results
          path: TestResults
